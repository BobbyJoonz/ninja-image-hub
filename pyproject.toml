[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor", "preview/dist", "node_modules", "data"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["hub/gateway_errors.py", "hub/version.py", "hub/effort.py"]
ignore_missing_imports = true
follow_imports = "skip"
strict = true
